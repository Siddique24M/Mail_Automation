spring.application.name=assistant

# ---------------- SERVER ----------------
# Bind to 0.0.0.0 so Render's port scanner can see it inside the Docker container
server.address=0.0.0.0
# Render dynamic port support. It defaults to 8081 locally to avoid "port already in use" errors.
server.port=${PORT:8081}

# Reduce Tomcat memory footprint (saves ~50MB RAM by spawning fewer threads)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# Load local .env file (optional, for local development only)
# Looks in both current dir (if running from backend) and backend dir (if running from root)
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

# ---------------- DATABASE (Supabase) ----------------
# Uses DB_URL from your .env file — points to Supabase by default
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mail_assistant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------- DATABASE (Local pgAdmin) ----------------
# To switch to your local pgAdmin database, comment out the 3 Supabase lines above
# and uncomment these 3 lines below (your local DB name is: mail_automation)
# ---------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/mail_automation
# spring.datasource.username=postgres
# spring.datasource.password=
# ---------------------------------------------------------

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP connection pool settings (Important for Supabase & Render)
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.idleTimeout=600000

# ---------------- GOOGLE OAUTH ----------------
google.client.client-id=${GOOGLE_CLIENT_ID:placeholder}
google.client.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
google.client.redirect-uri=${BACKEND_URL:http://localhost:8081}/login/oauth2/code/google

# ---------------- LOGGING ----------------
logging.level.org.springframework.web=INFO
logging.level.com.personal.assistant=DEBUG

# ---------------- FRONTEND ----------------
frontend.url=${FRONTEND_URL:http://localhost:5173}