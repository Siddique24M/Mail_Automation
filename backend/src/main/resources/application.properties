spring.application.name=assistant

# Render dynamic port (IMPORTANT for Render to detect the port)
server.port=${PORT:8080}

# Load local .env file (optional, for local development only)
spring.config.import=optional:file:.env[.properties]

# ---------------- DATABASE (Supabase) ----------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mail_assistant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - let Hibernate auto-detect dialect from driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Prevent startup crash if DB connection is slow (critical for Render)
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.maximumPoolSize=5

# ---------------- GOOGLE OAUTH ----------------
google.client.client-id=${GOOGLE_CLIENT_ID:placeholder}
google.client.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
google.client.redirect-uri=${BACKEND_URL:http://localhost:8080}/login/oauth2/code/google

# ---------------- LOGGING ----------------
logging.level.org.springframework.web=INFO
logging.level.com.personal.assistant=DEBUG

# ---------------- FRONTEND ----------------
frontend.url=${FRONTEND_URL:http://localhost:5173}