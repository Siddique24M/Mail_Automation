spring.application.name=assistant

# Render dynamic port (IMPORTANT)
server.port=${PORT:8080}

# ---------------- DATABASE (Supabase) ----------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Force PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Optional but safe
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prevent startup crash if DB is slow (good for Render)
spring.datasource.hikari.initializationFailTimeout=0

# ---------------- GOOGLE OAUTH ----------------
google.client.client-id=${GOOGLE_CLIENT_ID}
google.client.client-secret=${GOOGLE_CLIENT_SECRET}
google.client.redirect-uri=${BACKEND_URL}/login/oauth2/code/google

# ---------------- LOGGING ----------------
logging.level.org.springframework.web=INFO
logging.level.com.personal.assistant=DEBUG

# ---------------- FRONTEND ----------------
frontend.url=${FRONTEND_URL}